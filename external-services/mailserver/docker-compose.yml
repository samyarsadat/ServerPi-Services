# ServerPi Services - Mailserver Compose File
# Prepared by Samyar Sadat Akhavi, 2026. 

services:
    # MAIL SERVER (SMTP/IMAP)
    mailserver:
        image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
        container_name: mailserver
        hostname: mailserver
        restart: unless-stopped
        stop_grace_period: 1m
        network_mode: host
        env_file:
            - .env
            - mailserver.secrets.env
        cap_add:
            - NET_ADMIN
        depends_on:
            mail-certbot:
                condition: service_healthy
        volumes:
            - ./user-patches.sh:/tmp/docker-mailserver/user-patches.sh:ro
            - ./postfix-main.cf:/tmp/docker-mailserver/postfix-main.cf:ro
            - ./dovecot.cf:/tmp/docker-mailserver/dovecot.cf:ro
            - mail_data:/var/mail
            - mail_state:/var/mail-state
            - mail_logs:/var/log/mail
            - mail_config:/tmp/docker-mailserver
            - certbot:/etc/letsencrypt:ro
            - /etc/localtime:/etc/localtime:ro

    # POSTFIX PROMETHEUS EXPORTER
    postfix-exporter:
        image: sergeymakinen/postfix_exporter:v2.1.6
        container_name: postfix-exporter
        hostname: postfix-exporter
        restart: unless-stopped
        command:
            - --collector=file
            - --file.log=/var/log/mail/mail.log
        group_add:
            - "4"
        volumes:
            - mail_logs:/var/log/mail:ro
        networks:
            - caddy_net
        labels:
            org.label-schema.group: monitoring

    # LET'S ENCRYPT CERTBOT
    mail-certbot:
        image: certbot/dns-cloudflare:v5.7.0
        container_name: mail-certbot
        hostname: mail-certbot
        restart: unless-stopped
        env_file:
            - .env
            - certbot.secrets.env
        entrypoint: ["/bin/sh", "/certbot-entrypoint.sh"]
        volumes:
            - ./certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
            - certbot:/etc/letsencrypt
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    cert="/etc/letsencrypt/live/$${CERT_DOMAIN}/fullchain.pem";
                    key="/etc/letsencrypt/live/$${CERT_DOMAIN}/privkey.pem";
                    test -s "$$cert" &&
                    test -s "$$key" &&
                    openssl x509 -in "$$cert" -noout -checkend 0 &&
                    openssl x509 -in "$$cert" -noout -checkhost "$${CERT_DOMAIN}" &&
                    openssl pkey -in "$$key" -noout -check >/dev/null 2>&1 &&
                    cert_public="$$(openssl x509 -in "$$cert" -pubkey -noout)" &&
                    key_public="$$(openssl pkey -in "$$key" -pubout 2>/dev/null)" &&
                    test "$$cert_public" = "$$key_public"
            start_interval: 5s
            start_period: 5m
            interval: 10m
            timeout: 10s
            retries: 5

networks:
    caddy_net:
        name: $DOCKER_MY_NETWORK
        external: true

volumes:
    mail_data:
    mail_state:
    mail_logs:
    mail_config:
    certbot: