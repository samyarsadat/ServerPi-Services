# ServerPi Services - WatchTower Compose File
# Prepared by Samyar Sadat Akhavi, 2024-2026. 

services:
    watchtower:
        image: nickfedor/watchtower:1.21
        container_name: watchtower
        hostname: watchtower
        restart: unless-stopped
        env_file: .env
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock