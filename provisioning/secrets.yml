---
schema_version: 1

generated_secrets:
    grafana_admin_password:
        type: random_alphanumeric
        length: 48
    wordpress_mysql_root_password:
        type: random_alphanumeric
        length: 48
    wordpress_db_password:
        type: random_alphanumeric
        length: 48
    wordpress_slymetrics_encryption_key:
        type: random_alphanumeric
        length: 43
    wordpress_slymetrics_bearer_token:
        type: random_alphanumeric
        length: 64
    authelia_jwt_secret:
        type: random_alphanumeric
        length: 64
    authelia_session_secret:
        type: random_alphanumeric
        length: 64
    authelia_storage_encryption_key:
        type: random_alphanumeric
        length: 64
    authelia_storage_password:
        type: random_alphanumeric
        length: 64
    authelia_redis_password:
        type: random_alphanumeric
        length: 64

env_files:
    caddy/secrets.env:
      - key: GEOIPUPDATE_ACCOUNT_ID
        source: manual
      - key: GEOIPUPDATE_LICENSE_KEY
        source: manual
      - key: LOKI_BASIC_AUTH_HASH
        source: loki_basic_auth_hash
        literal_quote: true

    monitoring/secrets.env:
      - key: GF_SMTP_USER
        source: manual
      - key: GF_SMTP_PASSWORD
        source: manual
      - key: GRAFANA_ALERT_EMAIL
        source: manual
      - key: GF_SECURITY_ADMIN_PASSWORD
        source: grafana_admin_password

    monitoring/prometheus.secrets.env:
      - key: SLYMETRICS_BEARER_TOKEN
        source: wordpress_slymetrics_bearer_token

    sites/wordpress-test/database.secrets.env:
      - key: MYSQL_ROOT_PASSWORD
        source: wordpress_mysql_root_password
      - key: MYSQL_USER
        source: fixed
        value: wordpress
      - key: MYSQL_PASSWORD
        source: wordpress_db_password

    sites/wordpress-test/wordpress.secrets.env:
      - key: WORDPRESS_DB_USER
        source: fixed
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        source: wordpress_db_password
      - key: SLYMETRICS_ENCRYPTION_KEY
        source: wordpress_slymetrics_encryption_key
      - key: SLYMETRICS_BEARER_TOKEN
        source: wordpress_slymetrics_bearer_token

raw_files:
    authelia/config/secrets/JWT_SECRET:
        source: authelia_jwt_secret
    authelia/config/secrets/SESSION_SECRET:
        source: authelia_session_secret
    authelia/config/secrets/STORAGE_ENCRYPTION_KEY:
        source: authelia_storage_encryption_key
    authelia/config/secrets/STORAGE_PASSWORD:
        source: authelia_storage_password
    authelia/config/secrets/REDIS_PASSWORD:
        source: authelia_redis_password
    authelia/config/secrets/SMTP_PASSWORD:
        source: manual

secure_directories:
  - authelia/config
