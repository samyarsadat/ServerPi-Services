---
schema_version: 1

generated_secrets:
    roundcube_des_key:
        type: random_alphanumeric
        length: 24
    glpi_mysql_root_password:
        type: random_alphanumeric
        length: 48
    glpi_db_password:
        type: random_alphanumeric
        length: 48

env_files:
    caddy/secrets.env:
      - key: LOKI_BASIC_AUTH_USER
        source: fixed
        value: server-pi-two
      - key: LOKI_BASIC_AUTH_PASSWORD
        source: loki_basic_auth_password

    external-services/mailserver/certbot.secrets.env:
      - key: CF_DNS_API_TOKEN
        source: manual

    external-services/mailserver/mailserver.secrets.env:
      - key: RELAY_USER
        source: manual
      - key: RELAY_PASSWORD
        source: manual

    services/mail-client/secrets.env:
      - key: ROUNDCUBEMAIL_DES_KEY
        source: roundcube_des_key

    services/ics-glpi/database.secrets.env:
      - key: MYSQL_ROOT_PASSWORD
        source: glpi_mysql_root_password
      - key: MYSQL_PASSWORD
        source: glpi_db_password

    services/ics-glpi/glpi.secrets.env:
      - key: GLPI_DB_PASSWORD
        source: glpi_db_password

raw_files: {}
