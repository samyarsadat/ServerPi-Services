---
- name: Remove packages that conflict with Docker CE
  ansible.builtin.apt:
      name:
        - containerd
        - docker-compose
        - docker-compose-v2
        - docker-doc
        - docker.io
        - podman-docker
        - runc
      state: absent

- name: Create the APT keyring directory
  ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Install Docker's repository signing key
  ansible.builtin.get_url:
      url: https://download.docker.com/linux/{{ansible_facts["distribution"] | lower}}/gpg
      dest: "{{docker_apt_signing_key_path}}"
      owner: root
      group: root
      mode: "0644"
  register: host_docker_repository_key

- name: Configure the Docker APT repository
  ansible.builtin.template:
      src: docker.sources.j2
      dest: /etc/apt/sources.list.d/docker.sources
      owner: root
      group: root
      mode: "0644"
  register: host_docker_repository

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
      name:
        - containerd.io
        - docker-buildx-plugin
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
      state: present
      update_cache: "{{host_docker_repository.changed or host_docker_repository_key.changed}}"

- name: Create the Docker configuration directory
  ansible.builtin.file:
      path: /etc/docker
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.template:
      src: "{{serverpi_managed_configuration_files.docker_daemon.source}}"
      dest: "{{serverpi_managed_configuration_files.docker_daemon.destination}}"
      owner: root
      group: root
      mode: "0644"
      validate: /usr/bin/dockerd --validate --config-file %s
  register: host_docker_daemon_configuration

- name: Enable Docker
  ansible.builtin.systemd_service:
      name: docker
      enabled: true
      state: "{{'restarted' if host_docker_daemon_configuration.changed else 'started'}}"

- name: Inspect the shared Caddy network
  ansible.builtin.command: /usr/bin/docker network inspect {{docker_caddy_network_name}}
  register: host_docker_caddy_network
  changed_when: false
  failed_when:
    - host_docker_caddy_network.rc != 0
    - "'No such network' not in host_docker_caddy_network.stderr"
  check_mode: false

- name: Require the existing Caddy network to match its configuration
  ansible.builtin.assert:
      that:
        - host_docker_caddy_network_configuration.Driver == docker_caddy_network_driver
        - >-
          docker_caddy_network_subnet
          in (host_docker_caddy_network_configuration.IPAM.Config | map(attribute='Subnet') | list)
      fail_msg: >-
          Docker network {{docker_caddy_network_name}} already exists with different settings.
  vars:
      host_docker_caddy_network_configuration: >-
          {{host_docker_caddy_network.stdout | from_json | first}}
  when: host_docker_caddy_network.rc == 0

- name: Create the shared Caddy network
  ansible.builtin.command:
      argv:
        - /usr/bin/docker
        - network
        - create
        - --driver
        - "{{docker_caddy_network_driver}}"
        - --subnet
        - "{{docker_caddy_network_subnet}}"
        - "{{docker_caddy_network_name}}"
  when: host_docker_caddy_network.rc != 0

- name: Add operators to the Docker group
  ansible.builtin.user:
      name: "{{item}}"
      groups: docker
      append: true
  loop: "{{docker_users}}"
