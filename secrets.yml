---
- name: Generate and install service secrets
  hosts: server_pis
  become: false
  gather_facts: false
  strategy: linear

  vars:
      serverpi_force_regenerate_secrets: false

  pre_tasks:
    - name: Reject check mode because secret state must be persistent
      ansible.builtin.assert:
          that:
            - not ansible_check_mode
          fail_msg: secrets.yml must run normally because generated values must be saved before they are installed.

    - name: Warn about forced secret regeneration
      ansible.builtin.debug:
          msg: All generated secrets will be rotated and overwritten on every host.
      when:
        - serverpi_force_regenerate_secrets | bool
        - inventory_hostname == ansible_play_hosts_all[0]

    - name: Prepare secret state on the controller
      delegate_to: localhost
      when: inventory_hostname == ansible_play_hosts_all[0]
      no_log: true
      block:
        - name: Generate every secret required by the host profiles
          ansible.builtin.command:
              argv: >-
                  {{
                      [
                          ansible_playbook_python,
                          serverpi_secret_tool_source,
                          'generate',
                          '--state-file', serverpi_secret_state_file
                      ]
                      + (['--force'] if (serverpi_force_regenerate_secrets | bool) else [])
                  }}
              stdin: >-
                  {{
                    {
                      'configs': [serverpi_shared_secret_config]
                          + (groups['server_pis'] | map('extract', hostvars, 'serverpi_secret_config') | list)
                    } | to_json
                  }}
              stdin_add_newline: false
          register: serverpi_secret_generation
          changed_when: serverpi_secret_generation.rc == 0 and (serverpi_secret_generation.stdout | from_json).changed

        - name: Load generated secret material for target installation
          ansible.builtin.set_fact:
              serverpi_secret_state: "{{lookup('ansible.builtin.file', serverpi_secret_state_file) | from_json}}"
          delegate_facts: true

  tasks:
    - name: Validate secret-management prerequisites
      ansible.builtin.include_tasks: tasks/preflight-secret-host.yml

    - name: Apply generated secret values
      ansible.builtin.command:
          argv: >-
              {{
                  [
                      '/usr/bin/python3',
                      serverpi_secret_tool_path,
                      'apply',
                      '--root', serverpi_services_root
                  ]
                  + (['--force'] if (serverpi_force_regenerate_secrets | bool) else [])
              }}
          stdin: >-
              {{
                  {
                      'state': hostvars['localhost']['serverpi_secret_state'],
                      'config': serverpi_secret_config
                  } | to_json
              }}
          stdin_add_newline: false
      register: serverpi_secret_application
      changed_when: serverpi_secret_application.rc == 0 and (serverpi_secret_application.stdout | from_json).changed
      become: true
      no_log: true

    - name: Secure declared secret paths
      ansible.builtin.include_tasks: tasks/secure-host-secrets.yml
