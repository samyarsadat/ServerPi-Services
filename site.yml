---
- name: Provision ServerPi hosts
  hosts: server_pis
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Validate the target platform
      ansible.builtin.assert:
          that:
            - ansible_facts["os_family"] == "Debian"
            - ansible_facts["distribution"] in ["Debian", "Ubuntu"]
            - ansible_facts["architecture"] in serverpi_architectures
          fail_msg: >-
              This playbook only supports Debian/Ubuntu on aarch64 or x86_64;
              found {{ansible_facts["distribution"]}} {{ansible_facts["architecture"]}}.

  roles:
    - host
