---
- name: Check the installed common secret tool
  ansible.builtin.stat:
      path: "{{serverpi_secret_tool_path}}"
      checksum_algorithm: sha256
  register: serverpi_secret_tool

- name: Require host provisioning before secret management
  ansible.builtin.assert:
      that:
        - serverpi_secret_tool.stat.isreg | default(false)
        - serverpi_secret_tool.stat.executable | default(false)
        - >-
          serverpi_secret_tool.stat.checksum | default('')
          == serverpi_secret_tool_checksum
      fail_msg: Run ansible-playbook site.yml before managing secrets.

- name: Check the configured services repository
  ansible.builtin.stat:
      path: "{{serverpi_services_root}}"
  register: serverpi_services_directory

- name: Require an existing services repository
  ansible.builtin.assert:
      that:
        - serverpi_services_directory.stat.isdir | default(false)
      fail_msg: "{{serverpi_services_root}} must be the existing services repository."

- name: Read the checked-out services branch
  ansible.builtin.command: /usr/bin/git branch --show-current
  args:
      chdir: "{{serverpi_services_root}}"
  register: serverpi_checked_out_branch
  changed_when: false

- name: Require the service branch configured for this host
  ansible.builtin.assert:
      that:
        - serverpi_checked_out_branch.stdout == inventory_hostname
      fail_msg: >-
          {{inventory_hostname}} must have its matching branch checked out; found
          {{serverpi_checked_out_branch.stdout | default('unknown')}}.
