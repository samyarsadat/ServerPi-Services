---
- name: Check the host resolver link
  ansible.builtin.stat:
      path: /etc/resolv.conf
      follow: false
  register: serverpi_resolver_link

- name: Require host lookups to use the validating stub
  ansible.builtin.assert:
      that:
        - serverpi_resolver_link.stat.islnk | default(false)
        - serverpi_resolver_link.stat.lnk_source | default('') == '/run/systemd/resolve/stub-resolv.conf'

- name: Read effective DNS servers
  ansible.builtin.command: >-
      /usr/bin/busctl --json=short get-property org.freedesktop.resolve1
      /org/freedesktop/resolve1 org.freedesktop.resolve1.Manager DNS
  register: serverpi_effective_dns
  changed_when: false

- name: Require only the configured global IPv4 DNS servers
  ansible.builtin.assert:
      that:
        - serverpi_dns_entries | map('first') | unique | list == [0]
        - serverpi_dns_entries | map(attribute=1) | unique | list == [2]
        - serverpi_dns_entries | map('last') | map('join', '.') | list == serverpi_dns_servers
      fail_msg: The resolver has unexpected global or interface-provided DNS servers.
  vars:
      serverpi_dns_entries: "{{(serverpi_effective_dns.stdout | from_json).data}}"

- name: Read effective DNSSEC mode
  ansible.builtin.command: >-
      /usr/bin/busctl --json=short get-property org.freedesktop.resolve1
      /org/freedesktop/resolve1 org.freedesktop.resolve1.Manager DNSSEC
  register: serverpi_effective_dnssec
  changed_when: false

- name: Require local DNSSEC validation
  ansible.builtin.assert:
      that:
        - (serverpi_effective_dnssec.stdout | from_json).data == serverpi_dnssec

- name: Test DNSSEC through the host and Docker resolvers
  vars:
      serverpi_dns_test_cases:
        - domain: cloudflare.com
          status: NOERROR
          rc: 0
        - domain: dnssec-failed.org
          status: SERVFAIL
          rc: 1
      serverpi_dns_test_image: busybox:1.37.0
  block:
    - name: Query the host stub over UDP and TCP
      ansible.builtin.command: >-
          /usr/bin/dig @127.0.0.53 {{item.0.domain}} A +dnssec +adflag
          +time=5 +tries=1 +noall +comments {{item.1}}
      loop: "{{serverpi_dns_test_cases | product(['+notcp', '+tcp']) | list}}"
      loop_control:
          label: "{{item.0.domain}} {{item.1}}"
      register: serverpi_host_dns_queries
      changed_when: false

    - name: Require the expected host DNSSEC responses
      ansible.builtin.assert:
          that:
            - item.stdout is search('status:[ \t]*' ~ item.item.0.status ~ '[ \t]*,')
            - item.item.0.status != 'NOERROR' or item.stdout is search('flags:[^;]*[ \t]ad[ \t;]')
          fail_msg: "Unexpected DNSSEC response for {{item.item.0.domain}}: {{item.stdout}}"
      loop: "{{serverpi_host_dns_queries.results}}"
      loop_control:
          label: "{{item.item.0.domain}} {{item.item.1}}"

    - name: Query DNS from temporary Docker containers
      ansible.builtin.command: >-
          /usr/bin/docker run --rm --network {{item.1}} {{serverpi_dns_test_image}}
          nslookup -type=A {{item.0.domain}}
      loop: "{{serverpi_dns_test_cases | product(['bridge', docker_caddy_network_name]) | list}}"
      loop_control:
          label: "{{item.1}}: {{item.0.domain}}"
      register: serverpi_container_dns_queries
      changed_when: false
      failed_when: false

    - name: Require the expected container DNSSEC responses
      ansible.builtin.assert:
          that:
            - item.rc == item.item.0.rc
            - item.item.0.status != 'SERVFAIL' or 'SERVFAIL' in (item.stdout ~ item.stderr)
            - >-
              item.item.1 != 'bridge' or
              item.stdout is search('(?m)^Server:[ \t]*' ~ (serverpi_dns_listener | regex_escape) ~ '[ \t]*$')
          fail_msg: "Container DNS failed on {{item.item.1}} for {{item.item.0.domain}}: {{item.stdout}} {{item.stderr}}"
      loop: "{{serverpi_container_dns_queries.results}}"
      loop_control:
          label: "{{item.item.1}}: {{item.item.0.domain}}"
