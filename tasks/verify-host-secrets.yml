---
- name: Validate secret values and shared relationships
  ansible.builtin.command:
      argv: >-
          {{
              [
                  '/usr/bin/python3',
                  serverpi_secret_tool_path,
                  'verify',
                  '--root', serverpi_services_root
              ]
          }}
      stdin: >-
          {{
              {
                  'state': hostvars['localhost']['serverpi_secret_state'],
                  'config': serverpi_secret_config
              } | to_json
          }}
      stdin_add_newline: false
  register: serverpi_secret_verification
  changed_when: false
  failed_when: false
  become: true
  no_log: true

- name: Prepare safe secret verification diagnostics
  ansible.builtin.set_fact:
      serverpi_secret_verification_issues: >-
          {{
              (serverpi_secret_verification.stdout | from_json).issues
              if serverpi_secret_verification.stdout | trim is match('^\{\s*"ok"\s*:')
              else [
                  (serverpi_secret_verification.stderr | from_json).error
                  if serverpi_secret_verification.stderr | trim is match('^\{\s*"ok"\s*:')
                  else 'Secret verification command failed before returning diagnostics'
              ]
          }}
  when: serverpi_secret_verification.rc != 0

- name: Require valid service secrets
  ansible.builtin.assert:
      that:
        - serverpi_secret_verification.rc == 0
      fail_msg: >-
          Secret verification failed for {{inventory_hostname}}:
          {{serverpi_secret_verification_issues | default([]) | join('; ')}}

- name: Check declared secret path permissions
  ansible.builtin.include_tasks:
      file: secure-host-secrets.yml
      apply:
          check_mode: true

- name: Require secured declared secret paths
  ansible.builtin.assert:
      that:
        - not serverpi_secret_env_file_permissions.changed
        - not serverpi_raw_secret_file_permissions.changed
        - not serverpi_secure_directory_permissions.changed
      fail_msg: Secret path permissions differ from their declared configuration.
