---
- name: Verify service secrets
  hosts: server_pis
  become: false
  gather_facts: false
  strategy: linear

  pre_tasks:
    - name: Load persistent secret state from the controller
      delegate_to: localhost
      when: inventory_hostname == ansible_play_hosts_all[0]
      block:
        - name: Check persistent secret state
          ansible.builtin.stat:
              path: "{{serverpi_secret_state_file}}"
          register: serverpi_secret_state_status

        - name: Require persistent secret state
          ansible.builtin.assert:
              that:
                - serverpi_secret_state_status.stat.isreg | default(false)
              fail_msg: Run ansible-playbook secrets.yml before verifying secrets.

        - name: Load persistent secret material
          ansible.builtin.set_fact:
              serverpi_secret_state: "{{lookup('ansible.builtin.file', serverpi_secret_state_file) | from_json}}"
          delegate_facts: true
          no_log: true

  tasks:
    - name: Validate secret-management prerequisites
      ansible.builtin.include_tasks: tasks/preflight-secret-host.yml

    - name: Verify every declared secret
      ansible.builtin.include_tasks: tasks/verify-host-secrets.yml
